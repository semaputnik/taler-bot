[project]
name = "taler-bot"
version = "0.1.0"
description = "Telegram bot that parses household receipts"
readme = "README.md"
authors = [
    { name = "Semaputnik", email = "semyon.putnikov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiogram-dialog>=2.6.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fluentogram>=1.2.1",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.57.0",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # fluent_compiler (via fluentogram) still uses a deprecated ast.Module call.
    "ignore::DeprecationWarning:fluent_compiler.*",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Generated; long CHECK expressions are fine there.
"alembic/versions/*" = ["E501"]
