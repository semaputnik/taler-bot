name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer run on the same ref supersedes the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taler
          POSTGRES_PASSWORD: taler
          POSTGRES_DB: taler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taler -d taler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite creates and drops its own scratch databases on this server.
      TEST_DATABASE_URL: postgresql+asyncpg://taler:taler@localhost:5432/taler
      # The Redis screen store test flushes its own key in database 1.
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Migrations apply
        run: uv run alembic upgrade head
        env:
          DATABASE__URL: postgresql+asyncpg://taler:taler@localhost:5432/taler
      - name: Models match migrations
        run: uv run alembic check
        env:
          DATABASE__URL: postgresql+asyncpg://taler:taler@localhost:5432/taler

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
